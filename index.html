[3], "m": false, "e": "Mengaduk kompos setiap beberapa hari membantu proses penguraian (dekomposisi) berlangsung lebih cepat."}, {"n": 45, "t": "Why is it important to make holes in the sides and bottom of the plastic bin before adding compost materials?", "o": ["They help separate brown materials from green materials during composting.", "They allow air circulation and drainage, which support the decomposition process.", "They prevent organic materials from becoming dark and crumbly during decomposition.", "They help maintain the correct proportion of brown materials and green materials.", "They make it easier to remove finished compost without disturbing the container."], "k": [1], "m": false, "e": "Lubang di sisi dan dasar wadah memungkinkan sirkulasi udara dan drainase yang mendukung pengomposan."}, {"n": 46, "t": "A student adds equal amounts of brown and green materials to the composting bin. Based on the instructions, what adjustment should the student make?", "o": ["Add more green materials to create a ratio of two parts green to one part brown.", "Add more water to create a mixture of two parts water to one part green material.", "Add more brown materials to create a ratio of two parts brown to one part green.", "Add more food scraps to create a mixture of equal parts brown and green materials.", "Add more soil to create a ratio of two parts soil to one part brown material."], "k": [2], "m": false, "e": "Rasio ideal adalah dua bagian bahan cokelat berbanding satu bagian hijau, jadi siswa perlu menambah bahan cokelat."}, {"n": 47, "t": "After several days, a student notices that the compost mixture is very dry. Which action would best follow the instructions?", "o": ["Add water gradually until the mixture feels like a damp sponge.", "Add green materials continuously until the mixture becomes completely wet.", "Stop turning the mixture and leave the bin uncovered for two weeks.", "Remove the brown materials and replace them with fresh food scraps.", "Seal all the holes and keep the mixture dry until decomposition finishes."], "k": [0], "m": false, "e": "Campuran harus lembap seperti spons basah, jadi tambahkan air sedikit demi sedikit."}, {"n": 48, "t": "A student finds that the compost looks dark and crumbly after regular maintenance. Which decision best follows the final step of the procedure?", "o": ["Add fresh green materials and turn the mixture for another two weeks.", "Add more brown materials and increase the moisture before using it.", "Remove the compost immediately and mix it with fresh food scraps.", "Stop turning the compost and allow it to cure for two weeks before use.", "Drill additional holes and restart the layering process from the beginning."], "k": [3], "m": false, "e": "Langkah akhir: hentikan pengadukan dan biarkan kompos matang dua minggu sebelum dipakai."}]}, {"passage": ["How to Prepare for an English Test", "Goal: Learn how to study effectively to get a good score on your English exam.", "Materials:", "• Your English textbook, notebook, and class worksheets", "• Small paper flashcards or a notebook for new words", "• Pens, pencils, and colorful highlighters", "• A quiet study room with a table and a comfortable chair", "Steps:", "• Find a quiet study place: Choose a clean table in a quiet room with good light. Turn off your phone and computer so you can focus completely on your study without distractions.", "• Read your class notes: Look at the main grammar rules and vocabulary words in your textbook. Use colorful highlighters to mark the most important information, sentences, and examples.", "• Make simple flashcards: Write new English words on one side of a small paper card and write their meanings on the other side. Practice reading these cards every day until you remember all the words.", "• Do practice exercises: Answer a few exercise questions from your textbook or teacher’s worksheets to check your understanding. Ask a friend, sibling, or parent to check your answers.", "• Take regular short breaks: Study for 25 minutes, then rest for 5 minutes to relax your mind. Drink a glass of water and stretch your body before you start studying again.", "• Get enough sleep: Stop studying and go to bed early the night before the test. Sleep for at least 8 hours so your brain is fresh, active, and ready for the exam in the morning."], "img": null, "qs": [{"n": 49, "t": "A student studies English for several hours but keeps checking social media and messages. Based on the text, why might this student’s study method be ineffective?", "o": ["The student spends too much time reviewing grammar rules and vocabulary.", "The student uses colorful highlighters to identify important information.", "The student allows digital distractions to interrupt concentration during studying.", "The student practices exercises before asking someone to check the answers.", "The student takes short breaks after completing each study session."], "k": [2], "m": false, "e": "Teks menyarankan mematikan ponsel dan komputer agar fokus; gangguan digital membuat cara belajar tidak efektif."}, {"n": 50, "t": "Why does the procedure recommend using flashcards and completing practice exercises together?", "o": ["Both activities help students memorize information and evaluate their understanding.", "Both activities help students avoid reading notes and reviewing grammar rules.", "Both activities help students replace textbooks with shorter study materials.", "Both activities help students finish studying without asking others for assistance.", "Both activities help students improve concentration by eliminating regular breaks."], "k": [0], "m": false, "e": "Flashcard membantu mengingat kosakata, dan latihan soal mengecek pemahaman; keduanya saling melengkapi."}, {"n": 51, "t": "A student has only one evening left before an English test. The student understands the vocabulary but often makes grammar mistakes. Which strategy would be the most appropriate?", "o": ["Spend the entire evening memorizing familiar vocabulary using colorful flashcards.", "Read every textbook chapter repeatedly without answering any practice questions.", "Study continuously until midnight to review as much information as possible.", "Focus on grammar notes, complete practice exercises, and check incorrect answers.", "Rewrite all class notes neatly and postpone reviewing mistakes until after the test."], "k": [3], "m": false, "e": "Kosakata sudah dikuasai tetapi tata bahasa sering salah, jadi fokus pada catatan grammar, latihan soal, dan periksa jawaban yang salah."}, {"n": 52, "t": "A student follows the 25 minutes study minutes study schedule but feels tired and struggles to concentrate. Which adjustment best follows the procedure?", "o": ["Continue studying without breaks until all planned exercises have been completed.", "Replace the short breaks with additional reading to maximize study time.", "Stop studying permanently because feeling tired means learning is no longer possible.", "Spend each break checking messages to relax before returning to the textbook.", "Keep the short breaks, drink water, stretch, and resume studying afterward."], "k": [4], "m": false, "e": "Prosedur menyarankan istirahat singkat, minum air, dan peregangan sebelum melanjutkan belajar."}, {"n": 53, "t": "A student plans to study until 2 a.m. before an English test at 8 a.m. because several topics remain unfinished. Based on the text, which advice is best?", "o": ["Continue studying until every topic is covered, even if sleep becomes limited.", "Stop studying earlier, review essential points, and get sufficient sleep before the test.", "Memorize vocabulary throughout the night and skip breakfast before the examination.", "Replace sleep with repeated practice exercises to strengthen memory before the test.", "Study only the easiest topics and avoid sleeping until the examination begins."], "k": [1], "m": false, "e": "Prosedur menyarankan tidur cukup (minimal 8 jam) sebelum tes, jadi lebih baik berhenti lebih awal dan mengulang poin penting."}]}, {"passage": ["How Urban Flooding Happens", "Urban flooding occurs when rainwater accumulates in areas that cannot absorb or drain it quickly enough. Although heavy rainfall is a major cause, human activities can make the problem worse.", "In natural environments, soil and vegetation absorb much of the rainwater. Trees also slow the movement of water across the ground. However, cities often have roads, parking areas, and buildings made of concrete or asphalt. These surfaces prevent water from entering the soil, causing more rainwater to flow into streets and drainage systems.", "The problem becomes more serious when drainage channels are blocked by rubbish or are too small to carry the increasing volume of water. As a result, water rises and may enter houses, schools, and public facilities. The loss of green spaces can further increase the amount of surface runoff.", "Preventing urban flooding requires more than building larger drainage channels. Cities can improve waste management, protect green spaces, create rain gardens, and use surfaces that allow water to penetrate the ground. These measures help manage rainwater before it becomes a serious threat to communities."], "img": null, "qs": [{"n": 54, "t": "Why can two areas experience different levels of flooding even when they receive similar amounts of rainfall?", "o": ["One area may receive rainfall for longer periods than the other.", "One area may have more absorbent surfaces and effective drainage systems.", "One area may have more buildings that protect streets from heavy rainfall.", "One area may have wider roads that direct rainwater toward nearby buildings.", "One area may have more vehicles that reduce the movement of surface water."], "k": [1], "m": false, "e": "Daerah dengan permukaan yang lebih menyerap air dan drainase yang efektif akan mengalami banjir yang lebih ringan walau hujannya sama."}, {"n": 55, "t": "Which explanation best describes the relationship between urban development and increased surface runoff?", "o": ["Urban development increases vegetation, allowing more water to flow into streets.", "Urban development reduces rainfall, causing drainage systems to become less effective.", "Urban development creates permeable surfaces, preventing water from entering the soil.", "Urban development replaces absorbent ground with hard surfaces, increasing water flow.", "Urban development improves soil absorption, causing water to accumulate in buildings."], "k": [3], "m": false, "e": "Pembangunan mengganti tanah penyerap air dengan permukaan keras sehingga aliran permukaan meningkat."}, {"n": 56, "t": "A city regularly experiences flooding despite having large drainage channels. Which action would most directly address another cause identified in the text?", "o": ["Increase the number of parking areas near the city’s busiest commercial districts.", "Replace remaining green spaces with buildings that support economic development.", "Improve rubbish collection and maintain drainage channels to prevent blockages.", "Encourage residents to use private vehicles instead of walking through flooded streets.", "Construct additional concrete surfaces to direct rainwater away from residential areas."], "k": [2], "m": false, "e": "Penyebab lain dalam teks adalah saluran tersumbat sampah; solusi langsungnya memperbaiki pengumpulan sampah dan perawatan saluran."}, {"n": 57, "t": "What can be inferred about the role of green spaces in flood prevention?", "o": ["Green spaces can reduce runoff by helping the ground absorb more rainwater.", "Green spaces can eliminate flooding by preventing heavy rainfall from reaching cities.", "Green spaces can replace drainage systems by storing all rainwater during storms.", "Green spaces can increase runoff by preventing water from entering the surrounding soil.", "Green spaces can protect buildings by directing rainwater toward nearby streets."], "k": [0], "m": false, "e": "Ruang hijau membantu tanah menyerap hujan sehingga mengurangi aliran permukaan."}, {"n": 58, "t": "Which proposal would best address urban flooding through a combination of the causes discussed?", "o": ["Build wider roads, increase parking capacity, and expand commercial construction projects.", "Increase drainage capacity, remove rubbish, and preserve areas that absorb rainwater.", "Remove roadside trees, construct concrete parks, and increase the number of buildings.", "Focus on emergency shelters while allowing drainage channels to remain poorly maintained.", "Relocate schools and markets without changing the city’s drainage or land-use practices."], "k": [1], "m": false, "e": "Usulan terbaik menggabungkan penyebab dalam teks: tambah kapasitas drainase, buang sampah, dan lestarikan area penyerap air."}]}, {"passage": ["How a Solar Panel Produces Electricity", "Solar panels convert sunlight into electrical energy through a process called the photovoltaic effect. This technology allows sunlight to become a useful source of power for homes, schools, and other buildings.", "A solar panel contains many photovoltaic cells, usually made from semiconductor materials such as silicon. When sunlight reaches these cells, particles of light transfer energy to electrons in the material. The added energy allows some electrons to move, creating an electrical current when the cells are connected in a suitable circuit.", "The electricity generated by solar panels is generally direct current (DC). However, most household appliances use alternating current (AC). Therefore, a device called an inverter converts the electricity into a form suitable for household use. The electricity can then power appliances, charge batteries, or enter the electrical grid, depending on the system’s design.", "The amount of electricity produced depends on several factors, including sunlight intensity, panel orientation, shading, and temperature. For example, a panel partly covered by a tree may produce less electricity because fewer photovoltaic cells receive sufficient sunlight. Regular maintenance and appropriate installation can help improve performance.", "Although solar panels do not produce electricity at night without stored energy, they can reduce dependence on conventional electricity sources when combined with suitable storage or grid connections."], "img": null, "qs": [{"n": 59, "t": "Why does a typical household solar power system need an inverter?", "o": ["It increases the intensity of sunlight reaching the photovoltaic cells.", "It stores the electricity generated when the panels receive no sunlight.", "It converts alternating current from household appliances into direct current.", "It converts direct current into alternating current for household appliances.", "It prevents photovoltaic cells from absorbing excessive heat during operation."], "k": [3], "m": false, "e": "Panel surya menghasilkan arus searah (DC), sedangkan peralatan rumah memakai arus bolak-balik (AC); inverter mengubah DC menjadi AC."}, {"n": 60, "t": "A solar panel produces less electricity after a nearby tree grows taller. Which explanation best accounts for this change?", "o": ["The tree changes the semiconductor material inside the photovoltaic cells.", "The tree reduces the sunlight reaching the panel, lowering electrical generation.", "The tree converts the electricity generated by the panel into stored energy.", "The tree increases the inverter’s ability to supply electricity to appliances.", "The tree changes alternating current into direct current before household use."], "k": [1], "m": false, "e": "Pohon menaungi panel sehingga cahaya matahari yang diterima berkurang dan listrik yang dihasilkan menurun."}, {"n": 61, "t": "A school wants to install solar panels but has several buildings surrounded by tall trees. Which action would be most appropriate before installation?", "o": ["Install all panels immediately and assume that sunlight will remain sufficient.", "Purchase smaller inverters without examining the buildings’ sunlight conditions.", "Assess roof orientation and shading before selecting suitable panel locations.", "Remove all electrical appliances to reduce the school’s demand for electricity.", "Install panels only indoors where the equipment will be protected from weather."], "k": [2], "m": false, "e": "Sebelum memasang panel, perlu menilai arah atap dan bayangan agar lokasi pemasangan tepat."}, {"n": 62, "t": "Which statement best explains why solar panels can reduce dependence on conventional electricity sources?", "o": ["They convert sunlight into electricity that can supply appliances or the grid.", "They produce unlimited electricity regardless of weather or sunlight conditions.", "They eliminate the need for electrical circuits in residential buildings and schools.", "They transform household appliances into devices that operate without electricity.", "They prevent electricity demand from increasing during periods of high consumption."], "k": [0], "m": false, "e": "Panel mengubah sinar matahari menjadi listrik untuk peralatan atau jaringan, sehingga dapat mengurangi ketergantungan pada listrik konvensional."}, {"n": 63, "t": "A school plans to use solar electricity after sunset. Which proposal is most consistent with the explanation in the text?", "o": ["Install additional panels indoors so they can collect electricity during the night.", "Cover the panels during daylight to preserve sunlight for later electricity production.", "Disconnect the inverter so the panels can generate alternating current after sunset.", "Increase the panel temperature at night to maintain the photovoltaic effect.", "Combine the panels with battery storage or an appropriate grid connection."], "k": [4], "m": false, "e": "Panel tidak menghasilkan listrik di malam hari, jadi perlu dikombinasikan dengan baterai atau sambungan jaringan listrik."}]}, {"passage": ["How the Greenhouse Effect Warms Earth", "The greenhouse effect is a natural process that helps keep Earth warm enough to support life. It occurs when certain gases in the atmosphere absorb and re-emit some of the energy that Earth releases after receiving sunlight.", "First, sunlight passes through the atmosphere and warms Earth’s surface. The warmed surface then releases energy in the form of infrared radiation. Some atmospheric gases, including carbon dioxide, methane, and water vapor, absorb part of this outgoing radiation and re-emit energy in different directions. As a result, some energy returns toward the surface, keeping the lower atmosphere warmer than it would otherwise be.", "However, human activities have increased the concentration of several greenhouse gases. Burning fossil fuels releases additional carbon dioxide, while agriculture, waste management, and some industrial activities release methane and other gases. Higher concentrations of these gases strengthen the greenhouse effect, causing additional warming.", "This warming can influence weather patterns, melt glaciers, raise sea levels, and affect ecosystems. The effects are not identical everywhere because regions differ in geography, climate, and vulnerability.", "Reducing greenhouse gas emissions can help limit further warming. Using energy more efficiently, expanding low-carbon energy sources, protecting forests, and improving waste management are among the possible responses. The natural greenhouse effect is essential, but its human-driven intensification creates serious environmental challenges."], "img": null, "qs": [{"n": 64, "t": "What would most likely happen if Earth’s atmosphere absorbed much less outgoing infrared radiation?", "o": ["Earth’s surface would receive no sunlight because the atmosphere blocks incoming energy.", "Earth’s surface would become warmer because more infrared radiation returned downward.", "Earth’s average temperature would decrease because less outgoing energy returned toward the surface.", "Earth’s greenhouse gas concentrations would increase because less radiation escaped into space.", "Earth’s atmosphere would stop allowing sunlight to reach plants and other living organisms."], "k": [2], "m": false, "e": "Jika atmosfer menyerap lebih sedikit radiasi inframerah, lebih sedikit energi kembali ke permukaan sehingga suhu rata-rata Bumi turun."}, {"n": 65, "t": "Which statement best distinguishes the natural greenhouse effect from its human-driven intensification?", "o": ["The natural effect warms Earth, while human activities strengthen warming by increasing greenhouse gases.", "The natural effect cools Earth, while human activities prevent sunlight from entering the atmosphere.", "The natural effect produces pollution, while human activities remove greenhouse gases from the atmosphere.", "The natural effect occurs only in cities, while human activities affect only the polar regions.", "The natural effect depends on fossil fuels, while human activities reduce atmospheric heat retention."], "k": [0], "m": false, "e": "Efek rumah kaca alami menghangatkan Bumi, sedangkan aktivitas manusia memperkuat pemanasan dengan menambah gas rumah kaca."}, {"n": 66, "t": "A government wants to reduce its contribution to global warming. Which policy most directly addresses a major cause described in the text?", "o": ["Expand fossil fuel consumption while improving the efficiency of industrial machinery.", "Increase forest clearing while encouraging additional development in natural habitats.", "Promote private vehicle use while reducing investment in low-carbon energy sources.", "Expand renewable energy and improve energy efficiency across major economic sectors.", "Increase waste production while postponing improvements to agricultural management practices."], "k": [3], "m": false, "e": "Kebijakan yang menjawab penyebab utama: perluas energi terbarukan dan tingkatkan efisiensi energi."}, {"n": 67, "t": "Why might the effects of global warming differ between two regions?", "o": ["Both regions necessarily produce equal greenhouse gas emissions every year.", "Regional geography, climate, and vulnerability influence how warming affects each place.", "Greenhouse gases absorb infrared radiation only in regions with high populations.", "Regions with colder climates cannot experience changes caused by global warming.", "The greenhouse effect stops operating whenever local weather conditions change."], "k": [1], "m": false, "e": "Geografi, iklim, dan kerentanan tiap wilayah memengaruhi dampak pemanasan global."}, {"n": 68, "t": "A community argues that reducing greenhouse gas emissions is unnecessary because the natural greenhouse effect supports life. Which response best challenges this argument?", "o": ["The natural greenhouse effect should be eliminated because all atmospheric warming is harmful.", "Greenhouse gases should be increased because higher concentrations always improve ecosystems.", "The natural greenhouse effect is useful, but additional human-caused warming creates risks.", "Human activities cannot influence global temperatures because sunlight controls all atmospheric processes.", "Environmental policies are unnecessary because natural processes always reverse human-caused changes."], "k": [2], "m": false, "e": "Efek rumah kaca alami memang bermanfaat, tetapi tambahan pemanasan akibat manusia menimbulkan risiko serius."}]}, {"passage": ["Schools Should Teach Digital Literacy as a Core Skill", "Digital technology has become part of everyday life, from communication and entertainment to education and employment. However, access to digital devices does not automatically mean that students can use them wisely. Therefore, schools should make digital literacy a core part of the curriculum.", "First, digital literacy helps students evaluate information critically. Online content can contain misleading claims, manipulated images, and unreliable sources. Students who learn to check authorship, compare sources, and examine evidence are better prepared to distinguish credible information from misinformation. These skills are particularly important when students conduct research or discuss controversial issues.", "Second, digital literacy promotes responsible online behavior. Students need to understand privacy, copyright, respectful communication, and the long-term consequences of their digital footprints. Without proper guidance, they may share personal information carelessly or use other people’s work without permission.", "Some people argue that students can develop these skills naturally by using technology every day. However, frequent use does not guarantee good judgment. A student may be skilled at navigating social media but still struggle to recognize manipulated information or protect personal data.", "Schools should therefore integrate digital literacy into different subjects rather than treating it as an optional topic. With practical guidance and regular opportunities to evaluate online information, students can become more independent, responsible, and critical digital citizens."], "img": null, "qs": [{"n": 69, "t": "What assumption underlies the writer’s argument that digital literacy should be part of the curriculum?", "o": ["Students who use technology frequently automatically understand its risks and limitations.", "Digital skills are useful only for students who intend to pursue technology-related careers.", "Schools can eliminate online misinformation by restricting students’ access to digital devices.", "Students need guidance to use digital information and technology responsibly and critically.", "Digital literacy is more important than every other academic skill taught in schools."], "k": [3], "m": false, "e": "Asumsinya: siswa membutuhkan bimbingan agar menggunakan informasi dan teknologi digital secara bertanggung jawab dan kritis."}, {"n": 70, "t": "Why does the writer mention students who are skilled at navigating social media?", "o": ["To demonstrate that frequent technology use does not guarantee critical digital judgment.", "To prove that social media skills are unnecessary for modern educational activities.", "To suggest that students should replace classroom learning with independent online exploration.", "To explain why schools should prevent students from accessing social media platforms.", "To establish that students learn digital literacy more effectively without teacher guidance."], "k": [0], "m": false, "e": "Contoh siswa mahir media sosial menunjukkan bahwa sering memakai teknologi tidak menjamin penilaian yang kritis."}, {"n": 71, "t": "A school introduces a digital literacy program that teaches students to compare sources, identify manipulated images, and protect personal data. How effectively does this program address the writer’s concerns?", "o": ["It addresses only entertainment habits and ignores the evaluation of online information.", "It addresses information reliability and online safety, which are central to the argument.", "It addresses copyright concerns but prevents students from developing independent research skills.", "It addresses device ownership while assuming that students already understand responsible technology use.", "It addresses academic performance but ignores privacy and the credibility of online information."], "k": [1], "m": false, "e": "Program itu mengajarkan membandingkan sumber, mengenali gambar manipulasi, dan melindungi data, yaitu keandalan informasi dan keamanan daring."}, {"n": 72, "t": "Which evidence would most strongly support the writer’s claim that digital literacy education is necessary?", "o": ["Data showing that students spend several hours daily using social media applications.", "Surveys showing that most students own smartphones and regularly access the internet.", "Evidence that students enjoy digital activities more than traditional classroom assignments.", "Reports showing that schools have purchased additional computers for classroom activities.", "Research showing that guided digital literacy instruction improves source evaluation and privacy awareness."], "k": [4], "m": false, "e": "Bukti terkuat adalah penelitian yang menunjukkan pengajaran terarah meningkatkan kemampuan menilai sumber dan kesadaran privasi."}, {"n": 73, "t": "Which statement best represents the relationship between the arguments and the writer’s recommendation?", "o": ["The arguments describe technological benefits, so schools should increase students’ screen time.", "The arguments criticize online communication, so schools should prohibit digital learning activities.", "The arguments identify information and safety challenges, supporting systematic digital literacy education.", "The arguments emphasize student independence, so schools should avoid teaching digital responsibility.", "The arguments focus on device ownership, supporting the distribution of smartphones to every student."], "k": [2], "m": false, "e": "Argumen tentang tantangan informasi dan keamanan mendukung pendidikan literasi digital yang sistematis."}, {"n": 74, "t": "A school teaches students how to operate software but does not teach them how to verify online claims. According to the text, what is the most reasonable evaluation?", "o": ["The program is sufficient because operating software guarantees responsible online decision-making.", "The program is ineffective because students should avoid using software in academic activities.", "The program is appropriate because checking information is unrelated to digital literacy.", "The program is incomplete because technical skills do not ensure critical information evaluation.", "The program is unnecessary because students can learn every digital skill through daily exposure."], "k": [3], "m": false, "e": "Program itu belum lengkap karena kemampuan teknis tidak menjamin siswa mampu mengevaluasi informasi secara kritis."}]}, {"passage": ["Public Transportation Should Be Improved in Urban Areas", "Traffic congestion has become a serious challenge in many urban areas. Long commuting times waste productive hours, increase stress, and contribute to air pollution. Improving public transportation is one practical way for cities to address these problems.", "First, reliable public transportation can reduce the number of private vehicles on the road. When buses and trains are affordable, frequent, and accessible, more people may choose them instead of driving their own cars or motorcycles. Fewer private vehicles can reduce congestion, especially during peak commuting hours.", "Second, public transportation can improve access to education and employment. People who cannot afford private vehicles need dependable ways to reach schools, universities, and workplaces. Well-planned routes and reasonable fares can make these opportunities more accessible to different groups of residents.", "However, simply adding more buses does not guarantee success. If services are unreliable, overcrowded, or poorly connected, people may continue using private vehicles. Cities must therefore invest in maintenance, route planning, passenger safety, and convenient connections between different transport services.", "Some critics argue that public transportation projects are expensive. Although infrastructure requires substantial investment, cities should also consider the long-term costs of congestion, pollution, and inefficient commuting. With careful planning and consistent management, improved public transportation can support a more accessible and sustainable urban environment."], "img": null, "qs": [{"n": 75, "t": "What is the main logical connection between reliable public transportation and reduced traffic congestion?", "o": ["Reliable services encourage private vehicle ownership by making urban travel more convenient.", "Reliable services encourage commuters to leave home earlier and increase total travel demand.", "Reliable services replace the need for roads by moving all commuters underground.", "Reliable services guarantee that every resident will stop using private vehicles immediately.", "Reliable services can persuade commuters to choose shared transport instead of private vehicles."], "k": [4], "m": false, "e": "Layanan andal dapat membujuk komuter memilih transportasi bersama daripada kendaraan pribadi, sehingga kemacetan berkurang."}, {"n": 76, "t": "Why does the writer discuss access to education and employment?", "o": ["To show that public transportation provides social benefits beyond reducing traffic congestion.", "To demonstrate that universities should provide private vehicles for students from rural areas.", "To argue that public transportation should serve workplaces rather than residential communities.", "To suggest that public transportation is useful only for people who cannot afford motorcycles.", "To prove that transport fares are the only factor determining access to education and employment."], "k": [0], "m": false, "e": "Penulis membahas akses pendidikan dan pekerjaan untuk menunjukkan manfaat sosial transportasi umum selain mengurangi kemacetan."}, {"n": 77, "t": "A city increases its bus fleet, but passengers still experience delays and poorly connected routes. Which conclusion best follows the writer’s argument?", "o": ["The city should discontinue bus services because adding vehicles cannot improve urban mobility.", "The city should focus on selling private vehicles to reduce demand for public transportation.", "The city should improve reliability and route connections alongside expanding its bus fleet.", "The city should increase fares immediately because higher prices guarantee better service quality.", "The city should build more parking areas because passengers prefer driving to using public transport."], "k": [2], "m": false, "e": "Menambah armada saja tidak cukup; kota perlu meningkatkan keandalan dan koneksi rute."}, {"n": 78, "t": "Which evidence would most strongly support the claim that improved public transportation can reduce congestion?", "o": ["A survey showing that many residents prefer traveling during weekends rather than weekdays.", "Data showing that more commuters use public transport after service improvements and fewer drive.", "Reports showing that the city has purchased new buses without measuring passenger numbers.", "Interviews showing that some residents enjoy driving because they can choose their departure times.", "Statistics showing that urban populations grow while the number of residential buildings increases."], "k": [1], "m": false, "e": "Bukti terkuat adalah data bahwa lebih banyak komuter memakai transportasi umum dan lebih sedikit berkendara setelah layanan membaik."}, {"n": 79, "t": "How does the writer respond to the argument that public transportation projects are expensive?", "o": ["By denying that public transportation requires substantial financial investment from governments.", "By claiming that every public transportation project produces immediate financial profits.", "By suggesting that cities should prioritize private vehicles instead of improving public transport.", "By comparing initial investment with the longer-term costs of congestion and pollution.", "By arguing that transportation costs are unrelated to the quality of urban life."], "k": [3], "m": false, "e": "Penulis membandingkan investasi awal dengan biaya jangka panjang kemacetan dan polusi."}, {"n": 80, "t": "A city must choose between building additional parking facilities and improving bus reliability and route connections. Based on the text, which decision is best justified?", "o": ["Expand parking facilities because private vehicles provide the most accessible travel option.", "Delay both projects because transportation improvements cannot influence commuting behavior.", "Expand parking facilities because reducing public transport demand will prevent overcrowding.", "Divide the budget equally without considering the city’s congestion and accessibility problems.", "Improve bus reliability and route connections to encourage public transport use and reduce congestion."], "k": [4], "m": false, "e": "Perbaiki keandalan bus dan koneksi rute untuk mendorong penggunaan transportasi umum dan mengurangi kemacetan."}]}];
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const LT="ABCDE";let S=null,tm=null,lock=0,inExam=false;
const Q={};DATA.forEach((g,gi)=>g.qs.forEach(q=>Q[q.n]={...q,gi}));
function save(){try{localStorage.setItem(CFG.kunci,JSON.stringify(S))}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem(CFG.kunci))}catch(e){return null}}
function fmt(ms){const s=Math.max(0,Math.floor(ms/1000));return[Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(x=>String(x).padStart(2,"0")).join(":")}
function init(){
  if(location.hash==="#reset"){try{localStorage.removeItem(CFG.kunci)}catch(e){}location.hash=""}
  S=load();
  if(S&&S.done)return showResult();
  if(S&&S.student){inExam=true;go();return}
  S=null;showStart();
}
function showStart(){
  app.innerHTML=`<div class="wrap start"><div class="card"><h1>Ujian Akhir Semester Ganjil</h1><div style="color:var(--mut);font-weight:600">Bahasa Inggris · Kelas XII · TA 2026/2027 · ${Object.keys(Q).length} soal · ${CFG.menit} menit</div>
  <label>Nama Siswa</label><input id="f_nama" autocomplete="off" placeholder="Nama lengkap">
  <label>Kelas</label><input id="f_kelas" autocomplete="off" placeholder="Contoh: XII IPA 1">
  <label>Nomor Peserta Didik</label><input id="f_nomor" autocomplete="off" placeholder="NISN / nomor peserta">
  <label>Asal Sekolah</label><input id="f_sek" autocomplete="off" placeholder="Nama sekolah">
  <label>Token Ujian</label><input id="f_tok" autocomplete="off" placeholder="Token dari pengawas" style="text-transform:uppercase;letter-spacing:2px">
  <div class="err" id="err"></div>
  <ul class="rules"><li>Soal dan pilihan jawaban diacak untuk setiap peserta.</li><li>Dilarang berpindah tab, membuka jendela/aplikasi lain, atau keluar dari halaman ujian.</li><li><b>Peringatan hanya satu kali.</b> Pelanggaran kedua = ujian otomatis dikumpulkan.</li><li>Waktu berjalan terus walau halaman ditutup.</li></ul>
  <button class="btn big" id="mulai">Mulai Ujian</button></div></div>`;
  $("#mulai").onclick=()=>{
    const v=id=>$(id).value.trim(),st={nama:v("#f_nama"),kelas:v("#f_kelas"),nomor:v("#f_nomor"),sekolah:v("#f_sek")};
    if(Object.values(st).some(x=>!x))return $("#err").textContent="Lengkapi semua data peserta.";
    if(v("#f_tok").toUpperCase()!==CFG.token)return $("#err").textContent="Token salah. Tanyakan token kepada pengawas.";
    const order=shuf(DATA.map((_,i)=>i)).map(gi=>({gi,qs:shuf(DATA[gi].qs.map(q=>q.n)).map(n=>({n,p:shuf([0,1,2,3,4])}))}));
    S={student:st,flat:order.flatMap(o=>o.qs),ans:{},rg:{},cur:0,end:Date.now()+CFG.menit*60000,warn:0,done:false};
    save();inExam=true;try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}catch(e){}go();
  };
}
function go(){
  app.innerHTML=`<div class="hdr"><div><b>UAS Ganjil · Bahasa Inggris XII</b><small>${esc(S.student.nama)} · ${esc(S.student.kelas)} · ${esc(S.student.sekolah)}</small></div><div style="display:flex;gap:10px;align-items:center"><span id="wc" style="font-size:.8rem">Peringatan: ${S.warn}/1</span><div class="timer" id="tm">--:--:--</div></div></div>
  <div class="wrap"><div class="layout"><div class="card" id="qa"></div><div class="card side"><h3>Navigasi Soal</h3><div class="grid" id="gr"></div><div class="lg"><span><i style="background:var(--ok)"></i>Dijawab</span><span><i style="background:var(--rg)"></i>Ragu-ragu</span><span><i style="background:var(--no)"></i>Belum</span></div><button class="btn ok" style="width:100%" id="fin">Selesai &amp; Kumpulkan</button></div></div></div>`;
  $("#fin").onclick=confirmFin;tick();clearInterval(tm);tm=setInterval(tick,1000);render();
}
function tick(){const r=S.end-Date.now(),e=$("#tm");if(!e)return;e.textContent=fmt(r);e.classList.toggle("low",r<300000);if(r<=0)finish("Waktu ujian habis.")}
function status(i){const n=S.flat[i].n;return S.rg[n]?"r":(S.ans[n]&&S.ans[n].length?"a":"")}
function render(){
  const i=S.cur,it=S.flat[i],q=Q[it.n],g=DATA[q.gi],a=S.ans[q.n]||[];
  let ps="";
  if(g.img||g.passage.length){const ls=g.passage,t=ls.length>1&&ls[0].length<80&&!/[.:!?]$/.test(ls[0]);
    ps=`<div class="pass">${g.img?`<img src="${g.img}" alt="Teks bacaan">`:""}${ls.map((l,k)=>t&&k===0?`<h4>${esc(l)}</h4>`:`<p class="${/^adapted from/i.test(l)?"cap":""}">${esc(l)}</p>`).join("")}</div>`}
  $("#qa").innerHTML=`${ps}<span class="qn">Soal ${i+1} / ${S.flat.length}</span><p class="qt">${esc(q.t)}</p>${q.m?'<div class="hint">Pilih semua jawaban yang benar.</div>':""}
  ${it.p.map((oi,k)=>`<div class="opt ${a.includes(oi)?"sel":""}" data-o="${oi}"><span class="l">${LT[k]}</span><span>${esc(q.o[oi])}</span></div>`).join("")}
  <div class="nav"><button class="btn ghost" id="pv" ${i===0?"disabled":""}>◀ Sebelumnya</button><button class="btn rg ${S.rg[q.n]?"on":""}" id="rg">${S.rg[q.n]?"✓ Ragu-ragu":"Ragu-ragu"}</button>${i===S.flat.length-1?'<button class="btn ok" id="nx">Selesai ▶</button>':'<button class="btn" id="nx">Selanjutnya ▶</button>'}</div>`;
  document.querySelectorAll(".opt").forEach(e=>e.onclick=()=>{const o=+e.dataset.o;let c=S.ans[q.n]||[];c=q.m?(c.includes(o)?c.filter(x=>x!==o):[...c,o]):(c.includes(o)?[]:[o]);S.ans[q.n]=c;save();render()});
  $("#pv").onclick=()=>mv(i-1);$("#rg").onclick=()=>{S.rg[q.n]=!S.rg[q.n];save();render()};
  $("#nx").onclick=()=>i===S.flat.length-1?confirmFin():mv(i+1);
  $("#gr").innerHTML=S.flat.map((_,k)=>`<button class="n ${status(k)} ${k===i?"c":""}" data-k="${k}">${k+1}</button>`).join("");
  document.querySelectorAll(".n").forEach(b=>b.onclick=()=>mv(+b.dataset.k));
}
function mv(k){S.cur=Math.max(0,Math.min(S.flat.length-1,k));save();render();scrollTo(0,0)}
function confirmFin(){
  const t=S.flat.length;let a=0,r=0;S.flat.forEach((_,i)=>{const s=status(i);if(s==="a")a++;if(s==="r")r++});
  $("#mct").innerHTML=`Dijawab: <b>${a}</b> · Ragu-ragu: <b>${r}</b> · Belum dijawab: <b>${t-a-r}</b><br>Setelah dikumpulkan, jawaban tidak dapat diubah.`;
  $("#mc").classList.add("show");$("#mcn").onclick=()=>$("#mc").classList.remove("show");$("#mcy").onclick=()=>{$("#mc").classList.remove("show");finish("")};
}
function finish(reason){
  if(!S||S.done)return;inExam=false;clearInterval(tm);
  let ok=0;const tot=Object.keys(Q).length;
  Object.values(Q).forEach(q=>{const a=(S.ans[q.n]||[]).slice().sort().join(),k=q.k.slice().sort().join();if(a&&a===k)ok++});
  S.done=true;S.reason=reason;S.ok=ok;S.nilai=Math.round(ok/tot*10000)/100;save();
  try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}
  $("#mw").classList.remove("show");$("#mc").classList.remove("show");showResult();
}
function showResult(){
  const st=S.student,tot=Object.keys(Q).length,kosong=Object.values(Q).filter(q=>!(S.ans[q.n]||[]).length).length,salah=tot-S.ok-kosong;
  const rv=Object.values(Q).map(q=>{
    const a=S.ans[q.n]||[],b=a.length&&a.slice().sort().join()===q.k.slice().sort().join();
    return`<div class="card rv"><span class="qn">Soal ${q.n}</span><span class="tag" style="background:${b?"var(--ok)":a.length?"var(--bad)":"var(--mut)"}">${b?"Benar":a.length?"Salah":"Kosong"}</span><p class="qt" style="margin-top:8px">${esc(q.t)}</p>
    ${q.o.map((o,k)=>`<div class="opt ${q.k.includes(k)?"good":a.includes(k)?"wrong":""}"><span class="l">${LT[k]}</span><span>${esc(o)}${a.includes(k)?" <b>← jawaban kamu</b>":""}${q.k.includes(k)?" ✓":""}</span></div>`).join("")}
    <div class="pb"><b>Kunci:</b> ${q.k.map(k=>LT[k]).join(", ")} · <b>Jawabanmu:</b> ${a.length?a.slice().sort().map(k=>LT[k]).join(", "):"—"}<br><b>Pembahasan:</b> ${esc(q.e)}</div></div>`}).join("");
  app.innerHTML=`<div class="hdr"><b>Hasil Ujian Akhir Semester Ganjil</b><small>Bahasa Inggris · Kelas XII</small></div><div class="wrap"><div class="card" style="text-align:center"><div class="score" style="--p:${S.nilai}"><div>${S.nilai}</div></div><h2 style="margin:4px 0">Nilai Akhir</h2>${S.reason?`<div class="err">${esc(S.reason)}</div>`:""}
  <div class="stat"><span style="background:var(--ok)">Benar ${S.ok}</span><span style="background:var(--bad)">Salah ${salah}</span><span style="background:var(--mut)">Kosong ${kosong}</span></div>
  <div class="id" style="text-align:left"><div><b>Nama</b>${esc(st.nama)}</div><div><b>Kelas</b>${esc(st.kelas)}</div><div><b>No. Peserta Didik</b>${esc(st.nomor)}</div><div><b>Asal Sekolah</b>${esc(st.sekolah)}</div></div><button class="btn noprint" onclick="print()">🖨 Cetak Hasil</button></div>
  <h3 style="margin:20px 4px 0">Jawaban &amp; Pembahasan</h3>${rv}</div>`;
  document.body.style.userSelect="auto";scrollTo(0,0);
}
function violate(why){
  if(!inExam||!S||S.done)return;const n=Date.now();if(n-lock<1500)return;lock=n;S.warn++;save();
  const w=$("#wc");if(w)w.textContent=`Peringatan: ${Math.min(S.warn,1)}/1`;
  if(S.warn===1){$("#mwt").textContent="Terdeteksi: "+why+".";$("#mw").classList.add("show");$("#mwb").onclick=()=>$("#mw").classList.remove("show")}
  else finish("Ujian dihentikan otomatis karena pelanggaran kedua ("+why+").");
}
document.addEventListener("visibilitychange",()=>{if(document.hidden)violate("berpindah tab atau aplikasi")});
window.addEventListener("blur",()=>violate("membuka jendela/layar lain"));
["contextmenu","copy","cut","paste","dragstart"].forEach(e=>document.addEventListener(e,ev=>{if(inExam&&!ev.target.matches("input"))ev.preventDefault()}));
document.addEventListener("keydown",e=>{if(!inExam)return;const k=e.key.toLowerCase();if(k==="f12"||k==="printscreen"||(e.ctrlKey||e.metaKey)&&(["c","v","x","u","s","p","a"].includes(k)||e.shiftKey&&["i","j","c"].includes(k)))e.preventDefault()});
window.addEventListener("beforeunload",e=>{if(inExam){e.preventDefault();e.returnValue=""}});
init();
</script>
</body>
</html>
