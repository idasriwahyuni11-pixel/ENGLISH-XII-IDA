<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ujian Akhir Semester Ganjil – Bahasa Inggris XII</title>
<style>
:root{--bg:#eef2ff;--card:#fff;--ink:#1e1b4b;--mut:#64748b;--line:#e2e8f0;--pri:#4f46e5;--pri2:#06b6d4;--ok:#16a34a;--rg:#f59e0b;--no:#e2e8f0;--bad:#dc2626;--soft:#f5f7ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1226;--card:#1a1e3a;--ink:#e8eaff;--mut:#a0a8d0;--line:#2e3463;--no:#2e3463;--soft:#232850}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-user-select:none;user-select:none}
.hdr{background:linear-gradient(120deg,var(--pri),var(--pri2));color:#fff;padding:14px 18px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;box-shadow:0 2px 10px #0003}
.hdr b{font-size:1.05rem}.hdr small{opacity:.9;display:block}
.timer{background:#0003;border-radius:12px;padding:6px 14px;font:700 1.25rem/1.2 ui-monospace,Consolas,monospace}.timer.low{background:var(--bad);animation:p 1s infinite}@keyframes p{50%{opacity:.6}}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 4px 16px #4f46e515}
.start{max-width:520px;margin:28px auto}.start h1{margin:0 0 4px;font-size:1.5rem;background:linear-gradient(120deg,var(--pri),var(--pri2));-webkit-background-clip:text;background-clip:text;color:transparent}
label{display:block;font-weight:600;font-size:.85rem;margin:12px 0 4px}
input{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;font:inherit;background:var(--card);color:var(--ink);-webkit-user-select:text;user-select:text}input:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px #4f46e533}
.btn{border:0;border-radius:11px;padding:11px 18px;font:600 .95rem inherit;cursor:pointer;background:var(--pri);color:#fff}.btn:hover{filter:brightness(1.1)}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--soft);color:var(--pri);border:1.5px solid var(--line)}.btn.rg{background:var(--rg);color:#fff}.btn.rg.on{background:#b45309}.btn.ok{background:var(--ok)}.btn.big{width:100%;margin-top:18px;padding:13px;font-size:1.05rem;background:linear-gradient(120deg,var(--pri),var(--pri2))}
.rules{background:var(--soft);border-radius:12px;padding:10px 14px;font-size:.85rem;color:var(--mut);margin-top:14px}.rules li{margin:3px 0}
.err{color:var(--bad);font-size:.85rem;margin-top:8px;min-height:1em}
.layout{display:grid;grid-template-columns:1fr 290px;gap:16px;align-items:start}@media(max-width:900px){.layout{grid-template-columns:1fr}}
.pass{background:var(--soft);border-left:5px solid var(--pri2);border-radius:12px;padding:14px 16px;margin-bottom:16px;font-size:.95rem;max-height:46vh;overflow:auto}.pass p{margin:0 0 9px}.pass h4{margin:0 0 8px;color:var(--pri)}.pass img{max-width:100%;border-radius:10px;display:block}.pass .cap{font-size:.75rem;color:var(--mut)}
.qn{display:inline-block;background:var(--pri);color:#fff;border-radius:8px;padding:2px 11px;font-weight:700;margin-bottom:8px}.qt{font-size:1.05rem;font-weight:600;margin:0 0 12px}
.hint{font-size:.8rem;color:var(--rg);font-weight:600;margin:-6px 0 10px}
.opt{display:flex;gap:11px;align-items:flex-start;padding:11px 13px;border:2px solid var(--line);border-radius:12px;margin:8px 0;cursor:pointer;background:var(--card);transition:.12s}.opt:hover{border-color:var(--pri2);transform:translateX(2px)}
.opt.sel{border-color:var(--pri);background:var(--soft)}.opt .l{flex:none;width:30px;height:30px;border-radius:50%;background:var(--no);display:grid;place-items:center;font-weight:700;font-size:.85rem}.opt.sel .l{background:var(--pri);color:#fff}
.nav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:16px}
.side h3{margin:0 0 10px;font-size:1rem}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.n{border:2px solid transparent;border-radius:9px;padding:7px 0;font-weight:700;font-size:.85rem;background:var(--no);color:var(--ink);cursor:pointer}.n.a{background:var(--ok);color:#fff}.n.r{background:var(--rg);color:#fff}.n.c{border-color:var(--ink);box-shadow:0 0 0 2px var(--pri)}
.lg{display:flex;gap:10px;flex-wrap:wrap;font-size:.75rem;color:var(--mut);margin:12px 0}.lg i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:4px;vertical-align:-1px}
.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;z-index:20;padding:16px}.modal.show{display:grid}.modal .card{max-width:440px;text-align:center}.modal h2{margin:0 0 8px}
.score{width:150px;height:150px;border-radius:50%;margin:8px auto;display:grid;place-items:center;background:conic-gradient(var(--pri) calc(var(--p)*1%),var(--no) 0);position:relative}.score div{width:118px;height:118px;border-radius:50%;background:var(--card);display:grid;place-items:center;font:800 2.2rem/1 inherit}
.id{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin:14px 0}.id div{background:var(--soft);border-radius:10px;padding:8px 12px;font-size:.85rem}.id b{display:block;font-size:.7rem;color:var(--mut);text-transform:uppercase}
.stat{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:8px 0}.stat span{padding:5px 14px;border-radius:99px;font-weight:700;font-size:.85rem;color:#fff}
.rv{margin:14px 0}.rv .opt{cursor:default;margin:5px 0;padding:8px 12px}.rv .opt:hover{transform:none;border-color:var(--line)}.rv .good{border-color:var(--ok);background:#16a34a22}.rv .wrong{border-color:var(--bad);background:#dc262622}
.pb{background:var(--soft);border-left:4px solid var(--rg);border-radius:10px;padding:9px 13px;font-size:.88rem;margin-top:8px}.tag{font-size:.75rem;font-weight:700;padding:2px 10px;border-radius:99px;color:#fff;margin-left:8px}
.hide{display:none!important}@media print{.hdr,.btn,.noprint{display:none!important}body{background:#fff;color:#000}}
</style>
</head>
<body>
<div id="app"></div>
<div class="modal" id="mw"><div class="card"><h2 style="color:var(--bad)">⚠ Peringatan Kecurangan</h2><p id="mwt"></p><p><b>Ini adalah peringatan satu-satunya.</b> Pelanggaran berikutnya akan menghentikan ujian dan jawaban langsung dikumpulkan.</p><button class="btn" id="mwb">Saya mengerti, lanjutkan</button></div></div>
<div class="modal" id="mc"><div class="card"><h2>Kumpulkan Jawaban?</h2><p id="mct"></p><div style="display:flex;gap:10px;justify-content:center"><button class="btn ghost" id="mcn">Kembali</button><button class="btn ok" id="mcy">Ya, Kumpulkan</button></div></div></div>

": [2], "m": false, "e": "Teks berbentuk fact file tentang Lionel Messi, jadi tujuannya memberi informasi kepada pembaca tentang tokoh tersebut."}, {"n": 2, "t": "Why Messi was chosen as UNICEF ambassador?", "o": ["Because Messi won the third men’s world cup.", "Because Messi contributed in raising the money for medical center", "Because He moved to United State to play in Inter Miami", "Because he was the youngest player and to become the top goal scorer", "Because he has won the Balon d’ Or."], "k": [1], "m": false, "e": "Messi mendirikan organisasi untuk membantu anak rentan dan menyumbang dana ke pusat medis, sehingga ia dijadikan duta UNICEF."}, {"n": 3, "t": "What was the most challenging moment that Messi dealt in his Childhood?", "o": ["Messi was coming from poor family.", "He moved from Argentina to United States.", "He was relocated to Barcelona.", "He was forced to play footbal since childhood.", "He was diagnosed with a growth hormone."], "k": [2], "m": false, "e": "Teks menyebut keluarganya pindah ke Barcelona saat ia 13 tahun dan ia sulit beradaptasi (terpisah dari ibu dan saudaranya); inilah momen tersulit masa kecilnya."}]}, {"passage": ["Malala Yousafzai: A Voice for Education", "Malala Yousafzai is a Pakistani activist who became internationally known for her efforts to promote education for girls. She was born in Mingora, Pakistan, in 1997. Her father was a teacher and ran a school, so Malala grew up in an environment where education was highly valued. From a young age, she enjoyed learning and believed that every child should have the opportunity to attend school.", "When Malala was a teenager, the Taliban increasingly restricted girls’ access to education in her region. Despite the danger, she spoke publicly about the importance of education and shared her experiences through writing. Her courage attracted international attention, but it also made her a target of violence. In 2012, she was attacked while traveling home from school. She survived and later continued her campaign for education.", "After recovering, Malala became even more active internationally. She spoke at the United Nations and worked with organizations supporting education for children. In 2014, she received the Nobel Peace Prize and became the youngest person to receive the award.", "Malala’s journey shows that age does not necessarily determine a person’s ability to influence others. Her experience also demonstrates how education can become a powerful means of creating social change."], "img": null, "qs": [{"n": 4, "t": "Why did Malala’s childhood environment most likely influence her later activism?", "o": ["Her family showed her that education could influence people’s lives.", "Her family expected her to become a teacher like her father.", "Her family encouraged her to travel internationally at an early age.", "Her family introduced her to organizations supporting children’s rights.", "Her family wanted her to become famous through public activities."], "k": [0], "m": false, "e": "Ayah Malala adalah guru dan pengelola sekolah, sehingga ia tumbuh dengan keyakinan bahwa pendidikan dapat memengaruhi hidup banyak orang."}, {"n": 5, "t": "What can be inferred from Malala’s decision to continue her campaign after the attack?", "o": ["The experience convinced her that international attention was necessary.", "The experience encouraged her to focus mainly on personal achievements.", "The experience persuaded her that speaking publicly was always effective.", "The experience strengthened her determination to support education.", "The experience motivated her to leave education and pursue another career."], "k": [3], "m": false, "e": "Ia tetap berkampanye setelah diserang, menandakan pengalaman itu justru memperkuat tekadnya mendukung pendidikan."}, {"n": 6, "t": "Which factor most strongly explains why Malala became an international figure?", "o": ["She received support from many organizations after becoming famous.", "She connected personal experience with a broader social issue.", "She came from a family that had already worked in education.", "She became the youngest person to receive an international award.", "She spoke at important international events after recovering."], "k": [1], "m": false, "e": "Malala menghubungkan pengalaman pribadinya dengan isu sosial yang lebih luas (pendidikan anak perempuan), itulah yang membuatnya dikenal dunia."}, {"n": 7, "t": "What does the final paragraph suggest about the writer’s view of Malala’s achievement?", "o": ["Malala’s influence mainly resulted from receiving international recognition.", "Malala’s influence depended on her family’s educational background.", "Malala’s influence developed because she became famous at a young age.", "Malala’s influence resulted from courage and commitment to education.", "Malala’s influence increased after she began working with international organizations."], "k": [3], "m": false, "e": "Paragraf akhir menyiratkan bahwa pengaruh Malala lahir dari keberanian dan komitmennya pada pendidikan, bukan sekadar usia atau penghargaan."}]}, {"passage": ["The Great Barrier Reef", "The Great Barrier Reef is one of the most beautiful places in the world. It is located in the Pacific Ocean, near the northeast coast of Australia. The reef is very big. It stretches over 2,000 kilometers and can even be seen from space. There are many small coral islands and clear, warm waters around the reef.", "This reef is full of life. There are many kinds of colorful fish, sea turtles, dolphins, and even sharks. Coral of different shapes and colors grows under the water. Sea birds fly over the reef and nest on small islands. People can see this beauty by swimming, diving, or joining a boat tour.", "The colors under the water are amazing. Coral comes in red, yellow, green, and blue. Some coral looks like trees, and some looks like big round stones. Small fish swim in and out of the coral like they are playing a game. In some places, soft coral moves with the water like grass in the wind. When the sun shines, the reef looks bright and full of light. It feels like a different world under the sea.", "The reef is not only beautiful, but also very important. It helps protect the coast from big waves and storms. It is a home for sea animals and a place where plants can grow. Many people also get food and jobs from the sea near the reef. Without the reef, the ocean would not be the same.", "Adapted from: https://www.britannica.com/place/Great-Barrier-Reef"], "img": null, "qs": [{"n": 8, "t": "Which of the following descriptions are mentioned clearly in the text? There are more than one correct answer. Click on every correct answer.", "o": ["The reef was built by local communities over hundreds of years", "The reef is located near the Pacific Ocean far away from Australia", "The reef can help protect the coast from big waves", "The reef produces to sea turtles and dolphins", "The reef has more than 10,0000 coral islands"], "k": [2, 3], "m": true, "e": "Yang disebut jelas: terumbu melindungi pantai dari ombak besar dan menjadi rumah bagi penyu serta lumba-lumba. Pilihan lain bertentangan dengan teks atau tidak disebut."}, {"n": 9, "t": "The author mentioned “It feels like a different world under the sea”. What does the phrase \"a different world under the sea\" most likely mean?", "o": ["A safe place that has bright reef", "A peaceful place where people can live under water", "A colorful place that looks the same as the land", "A shining reef that is quiet", "A calm place that looks beautiful and unique"], "k": [4], "m": false, "e": "Frasa itu menggambarkan tempat yang tenang, indah, dan unik, berbeda dari suasana di daratan."}, {"n": 10, "t": "Which of the following best represents the main idea implied by the text?", "o": ["The reef is useful for fishing and shipping", "The reef is large, but not important to people", "The reef is a natural treasure that must be cared for", "The reef is only for scientists and researchers to explore", "The reef is a protected area that should be closed to visitors"], "k": [2], "m": false, "e": "Teks menekankan bahwa terumbu itu indah sekaligus penting, sehingga gagasan utamanya: kekayaan alam yang harus dijaga."}, {"n": 11, "t": "Which detail would best encourage people to visit the Great Barrier Reef?", "o": ["Visitors can see an Australian national park", "Visitors can stay in hotels around the reef", "Visitors can get there by boat or short flights", "Visitors can protect the coral and the animals", "Visitors can see the coral by diving or swimming"], "k": [4], "m": false, "e": "Melihat karang langsung dengan menyelam atau berenang adalah pengalaman paling menarik yang bisa mengajak orang berkunjung."}, {"n": 12, "t": "Which parts of the text best support the idea that the Great Barrier Reef is both beautiful and important?", "o": ["The reef helps protect the coast from big waves", "It is home to sea turtles, dolphins, and colorful fish", "The coral reefs grow best in cold, deep water", "Some areas of the reef are damaged by starfish and warm water", "The reef was discovered by sailors in the 1800s"], "k": [0, 1], "m": true, "e": "Keindahan didukung oleh kehidupan laut yang beragam (penyu, lumba-lumba, ikan berwarna) dan kepentingannya oleh fungsi melindungi pantai dari ombak."}]}, {"passage": ["Last semester, I joined a public speaking competition organized by several schools in my city. I had never participated in such a competition before, so I was both excited and nervous. My English teacher encouraged me to join because she believed that I had good ideas, although I often lacked confidence when speaking in front of others.", "For three weeks, I prepared my speech about the importance of reducing plastic waste. I practiced every afternoon and recorded my voice to identify pronunciation problems. However, on the competition day, I suddenly forgot part of my opening after seeing hundreds of students in the audience. I stood silently for several seconds. Instead of stopping, I took a deep breath and continued with the main idea of my speech.", "Surprisingly, I became more confident as I continued speaking. I even added an example that I had not planned before. When the judges announced the results, I did not win first place. I received third place, but I felt proud of myself. My teacher told me that the most important achievement was not the trophy but my ability to remain calm when things did not go as planned.", "The experience changed the way I viewed public speaking. I realized that being well-prepared was important, but being able to respond to unexpected situations was equally valuable."], "img": null, "qs": [{"n": 13, "t": "Why did the writer’s teacher encourage the writer to join the competition?", "o": ["The teacher knew the writer had won before.", "The teacher believed the writer had useful ideas.", "The teacher wanted the writer to meet new students.", "The teacher needed another student for the competition.", "The teacher thought the competition would be easy."], "k": [1], "m": false, "e": "Guru percaya penulis memiliki ide-ide yang bagus meski kurang percaya diri."}, {"n": 14, "t": "What can be inferred from the writer’s decision to continue after forgetting the opening?", "o": ["The writer had completely memorized the entire speech.", "The writer was no longer interested in winning the competition.", "The writer believed the judges would ignore the mistake.", "The writer could adapt when facing unexpected difficulties.", "The writer had prepared several different speeches beforehand."], "k": [3], "m": false, "e": "Penulis tetap melanjutkan pidato setelah lupa, menandakan ia mampu beradaptasi saat menghadapi kesulitan tak terduga."}, {"n": 15, "t": "Which event most directly changed the writer’s confidence during the competition?", "o": ["The writer successfully continued speaking after a mistake.", "The writer noticed that many students supported the speech.", "The writer remembered every part of the prepared opening.", "The writer discovered that the judges liked the chosen topic.", "The writer realized that other participants were equally nervous."], "k": [0], "m": false, "e": "Ia makin percaya diri setelah berhasil melanjutkan pidato meski melakukan kesalahan."}, {"n": 16, "t": "What does the teacher’s statement about the trophy imply?", "o": ["Personal growth can be more meaningful than competition results.", "Winning competitions is generally less important than studying.", "Receiving a trophy does not require strong speaking abilities.", "Competition results are usually determined by unexpected factors.", "Students should avoid joining competitions that involve public speaking."], "k": [0], "m": false, "e": "Guru menilai ketenangan lebih penting daripada trofi, artinya pertumbuhan diri bisa lebih bermakna daripada hasil lomba."}, {"n": 17, "t": "Which statement best represents the main lesson of the recount?", "o": ["Winning a competition requires practicing longer than other participants.", "Public speaking becomes easy when students memorize their speeches carefully.", "Students should choose simple topics when participating in competitions.", "Confidence develops naturally when people receive awards for their performance.", "Preparation should be combined with the ability to handle uncertainty."], "k": [4], "m": false, "e": "Pelajaran utama: persiapan itu penting, tetapi kemampuan menghadapi situasi tak terduga sama berharganya."}]}, {"passage": ["The School Garden Project", "At the beginning of the school year, our environmental club decided to create a small vegetable garden behind the school laboratory. The area had been unused for years and was covered with weeds. At first, the project seemed simple. We planned to clean the area, prepare the soil, plant vegetables, and take care of them until harvest.", "The first problem appeared when we discovered that the soil was too dry. Some members suggested buying new soil, but our budget was limited. After discussing several possibilities, we decided to make compost from fallen leaves and food scraps collected from the school canteen. It took several weeks before the compost was ready.", "Another challenge came when several plants died during a particularly hot week. Instead of giving up, we changed our watering schedule and covered the soil with dry leaves to keep moisture in it. Gradually, the plants began to grow again.", "Two months later, we harvested our first vegetables. The amount was not large enough to supply the school canteen, but it was enough to prove that our idea could work. More importantly, we learned that successful projects often require changes after the original plan meets real-world problems.", "Looking back, I realized that the garden project was not only about growing vegetables. It taught us how to solve problems together and use limited resources creatively."], "img": null, "qs": [{"n": 18, "t": "Why did the club decide to make compost instead of buying new soil?", "o": ["They wanted to produce vegetables without using natural materials.", "They believed compost could make the gardening project finish faster.", "They had discovered that purchased soil was unavailable locally.", "They needed to solve the soil problem within their limited budget.", "They wanted the school canteen to provide materials for gardening."], "k": [3], "m": false, "e": "Anggaran klub terbatas, sehingga mereka membuat kompos dari daun dan sisa makanan kantin sebagai solusi masalah tanah."}, {"n": 19, "t": "What does the members’ response to the dying plants show about their approach?", "o": ["They preferred waiting for better weather before making decisions.", "They considered replacing the entire garden with another project.", "They believed the original watering schedule had been successful.", "They were willing to modify their strategy when conditions changed.", "They depended on outside experts to solve problems in the garden."], "k": [3], "m": false, "e": "Mereka mengubah jadwal penyiraman dan menutup tanah dengan daun kering, menunjukkan kesediaan mengubah strategi saat kondisi berubah."}, {"n": 20, "t": "What would most likely have happened if the members had followed their original plan without changes?", "o": ["The garden would probably have required less daily attention.", "The members would have completed the project much earlier.", "The vegetables would have grown better because of regular watering.", "The members would have spent less time working with compost.", "The garden might have produced fewer healthy vegetables."], "k": [4], "m": false, "e": "Tanpa perubahan, tanaman yang mati tidak tertolong sehingga sayuran sehat yang dihasilkan kemungkinan lebih sedikit."}, {"n": 21, "t": "Which factor contributed most to the success of the garden project?", "o": ["The school provided enough money to replace the damaged plants.", "The members adapted their plans to overcome practical problems.", "The environmental club received professional gardening equipment.", "The members planted vegetables that required very little attention.", "The school canteen supplied all materials needed for the project."], "k": [1], "m": false, "e": "Faktor penentu keberhasilan adalah anggota yang menyesuaikan rencana untuk mengatasi masalah praktis."}, {"n": 22, "t": "What can be concluded about the writer’s attitude toward the project?", "o": ["The writer believes the project was successful because it produced food.", "The writer considers the project unsuccessful because its harvest was small.", "The writer values the learning process more than the harvest itself.", "The writer thinks gardening projects should always follow their original plans.", "The writer believes teamwork is unnecessary when solving practical problems."], "k": [2], "m": false, "e": "Penulis lebih menghargai proses belajar (memecahkan masalah bersama dan memakai sumber daya terbatas) daripada hasil panennya."}]}, {"passage": ["Attention all students!", "We would like to inform you that the school will hold an Emergency Preparedness Program titled “How to Survive for 7 Days During a Disaster.” This program will take place on Monday, 22 March 2026, from 08.00 a.m. to 01.30 p.m. in the school hall. The program is organized to help students understand basic survival skills that are needed during natural disasters such as earthquakes, floods, or volcanic eruptions.", "During the program, students will learn how to prepare an emergency kit, manage food and clean water for seven days, and stay safe while waiting for help. There will also be discussions about how to stay calm, make safe decisions, and work together with others in difficult situations. These skills are important because disasters can happen suddenly and without warning.", "All students are required to attend this program. Active participation is expected, as students will take part in simple simulations and group activities. Students are encouraged to bring a notebook and writing tools to record important information that may be useful in real emergency situations.", "Please wear your complete school uniform and arrive on time. Students must follow all instructions given by teachers and speakers to ensure safety and order during the program. Maintaining discipline and cooperation will help the program run smoothly.", "We hope this program will increase students’ awareness and readiness in facing disasters. By learning how to survive for seven days, students can protect themselves and help others in times of emergency.", "Thank you for your attention and cooperation.", "The School Committee"], "img": null, "qs": [{"n": 23, "t": "What is the primary goal of the Emergency Preparedness Program mentioned in the announcement?", "o": ["To train students with survival skills for disaster situations", "To give examples and test students’ physical strength during emergencies", "To help students to become disaster rescue volunteers in the school", "To explain different types of natural disasters in Indonesia", "To replace regular classroom learning for one day"], "k": [0], "m": false, "e": "Tujuan utama program adalah melatih siswa dengan keterampilan bertahan hidup saat bencana."}, {"n": 24, "t": "Why does the announcement emphasize survival for seven days?", "o": ["The program lasts exactly seven days", "Students are expected to live independently after school", "Most disasters end within a week", "The Food supplies only last for seven days", "The Help and rescue may not arrive immediately"], "k": [4], "m": false, "e": "Bantuan dan penyelamatan mungkin tidak segera datang, jadi siswa perlu mampu bertahan beberapa hari."}, {"n": 25, "t": "In the sentence “These skills are important because disasters can happen suddenly and without warning,” what does “These skills” refer to?", "o": ["Writing and note-taking skills", "Group discussion abilities and critical skill", "Survival and emergency preparedness skills", "Academic and critical thinking skills learned in class", "Communication skills with teachers"], "k": [2], "m": false, "e": "“These skills” merujuk pada keterampilan bertahan hidup dan kesiapsiagaan darurat yang dijelaskan di paragraf sebelumnya."}, {"n": 26, "t": "What can be inferred about the role of student participation in the success of the program?", "o": ["Student participation is optional, as the program mainly depends on explanations from teachers and guest speakers.", "Student participation is essential because the program includes simulations and activities that require active involvement.", "Student participation is limited to listening carefully since the program focuses more on theoretical knowledge.", "Student participation is only important for students who are interested in disaster management careers.", "Student participation is not necessary because all important information will be provided in written form."], "k": [1], "m": false, "e": "Program berisi simulasi dan kegiatan kelompok serta menuntut partisipasi aktif, sehingga keterlibatan siswa sangat penting."}]}, {"passage": ["Brenda and the Song of Her Heart", "Brenda lived in a small village at the edge of a wide green valley. People often said that she was not very smart. She struggled to read long sentences, forgot directions easily, and sometimes misunderstood simple instructions. Because of this, some villagers laughed at her or spoke to her impatiently. But what Brenda lacked in cleverness, she made up for with a heart that was endlessly kind.", "She greeted everyone with a warm smile. She helped elderly neighbors carry water, shared her food with hungry children, and listened patiently to anyone who needed a friend. Brenda never complained, even when people treated her unfairly. She believed that being kind was more important than being clever.", "Brenda had one special gift that set her apart from everyone else: her voice. It was clear, gentle, and beautiful, like a breeze moving through the trees at dawn. When she sang, even the birds seemed to pause and listen. Brenda often sang while she was washing clothes at the river, sweeping the yard, or walking through the fields. She did not sing to impress anyone, but she sang because it made her heart feel light.", "One year, a long drought struck the village. Crops failed, and people grew anxious and tired. Arguments became common, and hope began to fade. One evening, as the villagers gathered in the square to discuss their worries, Brenda stood quietly at the edge, listening. She could not offer clever solutions or wise advice, but she felt the heavy sadness in the air.", "Without thinking too much, Brenda began to sing. Her voice rose softly at first, then grew stronger, filling the square with warmth. The song spoke of patience, love, and the promise of brighter days. Slowly, the villagers fell silent. Angry faces softened, and tired eyes filled with tears. For a few moments, they forgot their fear and remembered how to care for one another.", "From that day on, whenever the village felt burdened by hardship, they asked Brenda to sing. They realized that intelligence was not the only measure of worth. Brenda taught them that kindness could heal wounds and that a beautiful voice, guided by a sincere heart, could bring people together.", "Brenda never became famous or wealthy, but she lived a meaningful life. And in the valley where she sang, her kindness Echond long after her song had ended."], "img": null, "qs": [{"n": 27, "t": "What does the story tell us about?", "o": ["Intelligence is the most important quality in life when it can heal the villages", "Villages often face natural disasters and must be aware to have the solutions", "A kind person can make a meaningful difference despite limitations", "Singing can bring fame, wealth and happines.", "People should always listen to music to be more relax and have emphaty to others"], "k": [2], "m": false, "e": "Cerita menunjukkan bahwa orang yang baik hati dapat memberi perbedaan bermakna meski memiliki keterbatasan."}, {"n": 28, "t": "Which of the following best describes Brenda’s character?", "o": ["Proud and ambitious", "Intelligent but careless", "Talented yet arrogant", "Quiet and selfish", "Patient, and sincere"], "k": [4], "m": false, "e": "Brenda digambarkan sabar dan tulus: membantu tanpa mengeluh dan bernyanyi bukan untuk pamer."}, {"n": 29, "t": "What is the most significant change in the villagers’ perception of Brenda throughout the story?", "o": ["They come to value her kindness and emotional impact, recognizing that her presence contributes to the community’s unity.", "They begin to see her as intellectually capable after realizing she can solve the village’s practical problems effectively.", "They start to admire her because she becomes more confident and speaks more clearly in front of others.", "They respect her mainly because she gains recognition from people outside the village for her singing ability.", "They begin to hate brenada because she show off her ability"], "k": [0], "m": false, "e": "Perubahan terbesar: warga akhirnya menghargai kebaikan dan pengaruh emosional Brenda yang mempersatukan mereka."}, {"n": 30, "t": "What deeper message does the story convey about the concept of “worth” in a community?", "o": ["A person’s worth is primarily determined by their intelligence and ability to provide logical solutions to problems.", "A person’s worth depends on their ability to gain recognition and achieve success beyond their local community.", "A person’s worth can be reflected through kindness and emotional support, even without strong intellectual abilities.", "A person’s worth is measured by how much they contribute to solving physical and economic challenges in society.", "A person’s worth is based on how well they adapt their weaknesses to become strengths in competitive situations."], "k": [2], "m": false, "e": "Pesan mendalam cerita: nilai seseorang dapat tercermin dari kebaikan dan dukungan emosional, meski kemampuan intelektualnya terbatas."}]}, {"passage": ["Lamine Yamal is a famous young football player from Spain. He was born on July 13, 2007, in Esplugues de Llobregat, Spain. His full name is Lamine Yamal Nasraoui Ebana. He grew up in a family with Spanish and Moroccan roots. From a young age, Yamal loved football and often played with other children. When he was seven years old, he joined the youth academy of FC Barcelona, one of the most famous football clubs in the world. At the academy, he trained regularly and showed great skill with the ball. His coaches soon noticed his speed, confidence, and ability to play against older players.", "In 2023, Yamal made his first-team debut for Barcelona when he was only 15 years old. He became one of the youngest players to appear for the club. After that, he continued to play in important matches and became more popular. He also made history with the Spanish national team. In September 2023, he played his first match for Spain at the age of 16. He scored his first international goal in the same match. His young age and strong performances made him an important player for Spain. In 2024, he played in the UEFA European Championship and helped Spain win the tournament.", "Since then, Yamal has received much attention from football fans around the world. He has continued to play for Barcelona and Spain while developing his skills and gaining more experience. Many people admire him because he achieved important things at a very young age. However, Yamal still has a long career ahead of him. His story shows that young people can achieve great results when they work hard, practice regularly, and use their talents. His journey has also inspired many young football players to follow their dreams.", "Source: Adapted from FC Barcelona and UEFA, 2024."], "img": null, "qs": [{"n": 31, "t": "Which of the following is the best summary of the text about Lamine Yamal?", "o": ["Lamine Yamal is a young Spanish football player who joined Barcelona at the age of seven, made his first-team debut at 15, played for Spain at 16, and helped Spain win the 2024 UEFA European Championship.", "Lamine Yamal is a famous football player from Spain who has played for Barcelona since he was seven and has won many international competitions with Spain.", "Lamine Yamal grew up in a Spanish-Moroccan family, loved football from childhood, and became famous because he was one of the youngest players in Barcelona’s history.", "Lamine Yamal became a professional football player after training at Barcelona’s academy, where his coaches recognized his speed, confidence, and ability to play with older players.", "Lamine Yamal is an inspiring young footballer whose success comes from practicing regularly, developing his skills, and playing important matches for Barcelona and Spain."], "k": [0], "m": false, "e": "Ringkasan terbaik memuat poin-poin utama: bergabung ke akademi usia 7, debut usia 15, bermain untuk Spanyol usia 16, dan juara Euro 2024."}, {"n": 32, "t": "What similarity can be inferred between Yamal and the young football players he inspires?", "o": ["They all already have journey which develop skills and gains more experience.", "They are all already famous around the world because of their talents.", "They have all achieved important and prestigious things at the same age.", "They have all played for the Spanish national team and Barcelona football club", "They have the opportunity to achieve their dreams through hard work"], "k": [4], "m": false, "e": "Yang dapat disimpulkan: seperti Yamal, para pemain muda juga punya peluang meraih mimpi melalui kerja keras."}, {"n": 33, "t": "Which statement best evaluates and appreciates Yamal’s journey based on the text?", "o": ["Yamal is admirable because his hard work helped him achieve success very young.", "Yamal is impressive because his football skills helped him become good person.", "Yamal is inspiring because his irregular practice helped him develop great football skills.", "Yamal is successful because his confidence helped him compete with older players.", "Yamal is remarkable because his talent helped him represent Spain at sixteen."], "k": [0], "m": false, "e": "Evaluasi yang sesuai dengan teks: Yamal patut dikagumi karena kerja kerasnya membuatnya sukses di usia sangat muda."}]}, {"passage": ["Jerome Polin Sijabat is a popular Indonesian content creator, student, and mathematics enthusiast. He was born in Jakarta on May 2, 1998. He grew up in a family that valued education. When he was a student, Jerome enjoyed learning mathematics and other subjects. He also dreamed of studying in Japan. After finishing high school, he received a scholarship to study at Waseda University in Tokyo, Japan. He studied Applied Mathematics and began sharing his experiences as an Indonesian student in Japan through social media. His videos showed his daily life, Japanese culture, food, and experiences as a student.", "While studying in Japan, Jerome became more popular through his YouTube channel, Nihongo Mantappu. He made many interesting videos with his friends and other students. He often used simple and funny ways to explain mathematics, Japanese language, and daily activities. His videos attracted many young viewers in Indonesia. Jerome also wrote a book about his experiences and continued to encourage students to enjoy learning. After completing his university education, he returned to Indonesia and continued his activities as a content creator and education enthusiast.", "Over the years, Jerome has become an inspiration for many Indonesian students. He has used his popularity to promote education and encourage young people to study hard. He has also worked with other young people to create educational content. Through his journey, Jerome showed that learning can be interesting and enjoyable. His experience as a student in Japan also taught many viewers about discipline, hard work, and independence. His story continues to motivate young Indonesians to dream big, work hard, and never stop learning.", "Source : Adapted from Waseda University and Jerome Polin’s official biography."], "img": null, "qs": [{"n": 34, "t": "Which sentence best summarizes Jerome Polin’s journey?", "o": ["Jerome Polin studied in Japan and made videos about his daily life posted in social media.", "Jerome Polin was interested in learning mathematics and explore Japanese culture.", "Jerome Polin studied in Japan, became a content creator, and inspired young people", "Jerome Polin became popular because he made funny videos about exploring Japan.", "Jerome Polin went to Japan because he wanted to become a YouTuber."], "k": [2], "m": false, "e": "Ringkasan terbaik: Jerome kuliah di Jepang, menjadi konten kreator, dan menginspirasi anak muda."}, {"n": 35, "t": "What is the best described Jerome Polin from the text?", "o": ["He is a content creator", "He is a student", "He is a popular athlete", "He only likes Math", "He inspires many people"], "k": [4], "m": false, "e": "Teks ditutup dengan Jerome sebagai inspirasi bagi banyak pelajar Indonesia, gambaran paling menyeluruh tentang dirinya."}, {"n": 36, "t": "What can readers infer about Jerome’s roles as a student and as a content creator?", "o": ["Both required him to communicate his knowledge with others.", "Both made him encorage to be a good teacher by learning new things.", "His student life was more important than his content creation.", "His content creation had nothing to do with education.", "He only used his knowledge when he was at university."], "k": [0], "m": false, "e": "Sebagai pelajar dan kreator, keduanya menuntut Jerome menyampaikan pengetahuannya kepada orang lain."}, {"n": 37, "t": "Which statement best explains how Jerome turned his student experience into an opportunity?", "o": ["He transformed his experiences abroad into content that informed and entertained viewers.", "He used his university education mainly to become a professional mathematics researcher.", "He changed his academic interests completely after discovering Japanese entertainment culture.", "He focused on building popularity first and used education only after becoming famous", "He separated his academic activities from social media because they had different purposes."], "k": [0], "m": false, "e": "Ia mengubah pengalaman belajar di luar negeri menjadi konten yang memberi informasi sekaligus menghibur."}]}, {"passage": ["Smartphones have become an important part of students’ daily lives. They are useful for communication, finding information, taking pictures, and even completing school assignments. However, allowing students to use smartphones freely during school hours can create several problems. Therefore, schools should set reasonable limits on smartphones use.", "First, smartphones can easily distract students from learning. When a phone is on the desk, students may be tempted to check messages, watch short videos, or open social media. Even when they are supposed to be listening to their teacher, a quick look at a notification can make them lose concentration. As a result, students may understand less of the lesson.", "Second, uncontrolled smartphones use can reduce students’ interaction with one another. School is not only a place to learn academic subjects but also a place to develop communication and social skills. If students spend their breaks looking at their screens, they may have fewer opportunities to talk, play, or solve problems together.", "For these reasons, schools should not simply ban smartphones. Instead, they should establish clear rules about when and how students may use them. For example, students could be required to keep their phones away during explanations but be allowed to use them when the teacher specifically asks them to. Such a policy would help students benefit from technology without allowing it to interfere with their education."], "img": null, "qs": [{"n": 38, "t": "What is the main idea of the text?", "o": ["Students should be prohibited from bringing smartphones to school to prevent distraction", "Students should be encouraged to use smartphones freely to improve their learning experiences.", "Schools should establish reasonable smartphone rules to balance learning and technology use.", "Teachers should replace classroom activities with smartphone applications to increase engagement.", "Students should prioritize online communication over face-to face interaction during school breaks."], "k": [2], "m": false, "e": "Gagasan utama: sekolah perlu menetapkan aturan wajar agar belajar dan penggunaan teknologi seimbang."}, {"n": 39, "t": "What can be inferred about the writer’s position on smartphone use in schools?", "o": ["Smartphones should be prohibited because they always prevent effective learning", "Smartphones should be controlled because their benefits depend on responsible use.", "Smartphones should be encouraged because they improve students’ academic performance", "Smartphones should be permitted because students need freedom during school hours", "Smartphones should be removed because teachers cannot control students’ online activities"], "k": [1], "m": false, "e": "Penulis menyiratkan ponsel perlu dikendalikan karena manfaatnya bergantung pada penggunaan yang bertanggung jawab."}, {"n": 40, "t": "How are the two arguments in the text connected to the writer’s recommendation?", "o": ["Both arguments explain why technology should replace traditional classroom activities.", "Both arguments demonstrate why students should avoid using digital devices completely", "Both arguments show how smartphones improve learning and social relationships.", "Both arguments identify negative effects that justify reasonable smartphone rules", "Both arguments suggest that teachers should allow students to manage their phones independently."], "k": [3], "m": false, "e": "Kedua argumen (gangguan belajar dan berkurangnya interaksi sosial) sama-sama menunjuk dampak negatif yang membenarkan aturan wajar."}, {"n": 41, "t": "Which school policy would best reflect the writer’s argument?", "o": ["Students may use smartphones freely as long as they finish their assignments.", "Students must leave smartphones at home to avoid all possible classroom distractions.", "Students may use smartphones during lessons whenever they feel they need informatio", "Students must surrender smartphones permanently to prevent unnecessary digital activites", "Students must put phones away during explanations but use them for teacher directed tasks."], "k": [4], "m": false, "e": "Kebijakan yang sesuai: ponsel disimpan saat penjelasan, tetapi boleh dipakai untuk tugas yang diarahkan guru."}, {"n": 42, "t": "Suppose a school introduces a smartphone policy that reduces classroom distractions but also limits students’ opportunities to use educational applications. Which evaluation best reflects the writer’s perspective?", "o": ["The policy is effective because preventing distractions matters more than educational technology.", "The policy is ineffective because students should decide when technology supports their learning.", "The policy needs adjustment because it should balance learning concentration with useful technology.", "The policy is unnecessary because smartphones rarely affect students’ academic and social development.", "The policy is successful because restricting smartphone access automatically improves learning outcomes."], "k": [2], "m": false, "e": "Kebijakan perlu disesuaikan agar menyeimbangkan konsentrasi belajar dengan pemanfaatan teknologi yang bermanfaat."}]}, {"passage": [], "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCARMAxsDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD1kUtJRXWecLS0lLQMKKKX3pAJS0DBGQcj1FFA7BSGlooAbRTsVyHiPxpDZO9rpgWedThpDyin+tRUqxpq8hPQ63tSVk+Fb+fU9Fhubpg0rFgxAx0Na9VCSlFSQBSUtIaoQlFLRimAlJS4oxQA2jFOxRigVhtJT8UYFFwsMpaDRimFhKSnbT6H8qMH0ouIbSGnYppIHUgfiKLoVhKKQyRr1kjH1cVG15aJ9+6t1+soo5kFiagVUbVdNX72oWo/7aiom17R1+9qloP+2gpc8e4WNGiss+I9EH/MVtf++6T/AISXQx/zFbX/AL6pe0h3Cxq0lZJ8UaEOuq2/4Go28XeH166nEfoDR7WHcLG3SYrAPjTw8P8AmIA/RDUbeOfD6/8AL25+kRpe2p9wsdHRXMN490EdJZm+kZqJ/iFoy/dW5b/gFL29PuFjrKK40/EXSv4be5P/AAEUxviNpw6Wlyfyo+sU+4WO1oriD8SLEDiwnP8AwIVG3xKtv4dNmP1kFL6xT7hY7wUYrgf+FlxdtLf/AL+ik/4WYh6aW3/
